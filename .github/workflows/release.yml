name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，留空则使用 dev-<sha>）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  go:
    needs: [meta, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: linux-x64 }
          - { goos: linux, goarch: arm64, name: linux-arm64 }
          - { goos: darwin, goarch: amd64, name: darwin-x64 }
          - { goos: darwin, goarch: arm64, name: darwin-arm64 }
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: panel/go.mod
          cache-dependency-path: panel/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -r ../web/dist/. internal/webui/dist/
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test ./...
      - name: Build
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD_TIME: ${{ needs.meta.outputs.build_time }}
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags="-s -w -X webclash/internal/buildinfo.Version=${VERSION} -X webclash/internal/buildinfo.BuildTime=${BUILD_TIME}" \
            -o "../dist-go/webclash-${{ matrix.name }}" ./cmd/webclash
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist-go/webclash-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [meta, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist-go
          merge-multiple: true
      - name: Package
        run: |
          set -eux
          cd dist-go
          chmod +x webclash-*
          for f in webclash-linux-x64 webclash-linux-arm64; do
            tar -cJf "$f.tar.xz" "$f"
          done
          for f in webclash-darwin-x64 webclash-darwin-arm64; do
            tar -czf "$f.tar.gz" "$f"
          done
          sha256sum webclash-* > SHA256SUMS
          cp ../scripts/install.sh install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: webclash-${{ needs.meta.outputs.version }}
          path: dist-go
          retention-days: 7
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-go/* \
            --title "WebClash $VERSION" \
            --generate-notes \
            --verify-tag

  docker:
    needs: [meta, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            BUILD_TIME=${{ needs.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
